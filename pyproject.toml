[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "femtools"
version = "0.1.0"
description = "Tools for legacy-dolfin solvers: XDMF and HDF5 output, probes, gradients"
requires-python = ">=3.10"
license = {text = "LGPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)"]
# dolfin (legacy 2019.2) comes from apt, not pip, and is imported only where it is used.
# Install with --no-deps beside dolfin: a pip mpi4py would be built against another MPI.
dependencies = ["numpy", "h5py"]

[project.optional-dependencies]
# under MPI, reading a quadratic grid back, and femtools.probes and femtools.gradient
dolfin = ["mpi4py", "scipy", "cppimport", "pybind11", "petsc4py"]
test = ["pytest"]

[project.scripts]
femtools-cut-facets = "femtools.facets:main"
femtools-build-dof-reorder = "femtools.dof_reorder:main"

[tool.setuptools.packages.find]
include = ["femtools*"]

[tool.setuptools.package-data]
# compiled by cppimport on import of femtools.probes or femtools.gradient, not before;
# cpp/dof_reorder_star.cpp by femtools-build-dof-reorder
femtools = ["cpp/*.cpp", "cpp/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning:ffc.*"]
markers = [
    "dolfin: needs legacy dolfin",
    "mpi: spawns mpirun; run serially",
    "slow: minutes, not seconds",
]
